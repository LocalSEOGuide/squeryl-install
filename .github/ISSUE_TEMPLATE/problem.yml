name: The install did not work
description: The install command failed, stopped, or left Squeryl in a state you did not expect.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**This repository is public.** Never paste a license key, an emailed code, a token or an email address, and keep client details out. Blank them out of any output you share."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: In your own words, and what you expected instead.
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: What computer?
      description: Not sure which Mac? The Apple menu → About This Mac shows the chip.
      options:
        - Mac with Apple Silicon
        - Mac with Intel
        - Something else
  - type: textarea
    id: output
    attributes:
      label: What the terminal printed
      description: The command you ran and its output, with keys, codes and email addresses blanked out.
      render: shell
  - type: dropdown
    id: how-bad
    attributes:
      label: How much does it get in your way?
      options:
        - I can't install
        - Annoying, but I got there
        - Small, whenever you get to it
