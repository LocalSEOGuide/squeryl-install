name: An idea or a request
description: Something the install should do, check or explain differently.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "**This repository is public.** Never paste a license key, an emailed code, a token or an email address, and keep client details out."
  - type: textarea
    id: need
    attributes:
      label: What are you trying to do?
      description: What you were trying to get done, and why it matters. That helps us more than a description of how to build it.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: Your idea of how it could work, if you have one.
